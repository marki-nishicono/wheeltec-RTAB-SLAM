frequency: 30
sensor_timeout: 0.3
two_d_mode: true
publish_tf: true
map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom
odom0: /wheel/odom
# Use wheel forward velocity and nonholonomic lateral constraint, not its
# integrated pose and not its yaw (which may share the onboard gyro).
odom0_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
odom0_queue_size: 10
imu0: /imu/calibrated
# No uncalibrated absolute heading or double integration of acceleration.
imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
imu0_queue_size: 30
imu0_remove_gravitational_acceleration: false
print_diagnostics: true
